name: Harness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce L4 engineering harness
        uses: paladini/harness-score@v1
        with:
          version: '1.5.2'
          min-level: '4'
          badge: ''
