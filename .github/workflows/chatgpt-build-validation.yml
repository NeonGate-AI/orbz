name: ChatGPT Build Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate

      - name: Apply pending split-repository changes
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs')

          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          root.devDependencies['@types/react'] = '19.2.18'
          root.exports['./react-types'] = {
            types: './dist/react-types.d.ts',
            import: './dist/react-types.js',
            default: './dist/react-types.js'
          }
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n')

          let config = fs.readFileSync('tsdown.config.ts', 'utf8')
          config = config.replace("  entry: {", "  deps: {\n    neverBundle: ['react']\n  },\n  entry: {")
          config = config.replace(
            "    orbz: 'src/index.ts'",
            "    orbz: 'src/index.ts',\n    'react-types': 'src/react.types.ts'"
          )
          fs.writeFileSync('tsdown.config.ts', config)

          for (const name of ['angular', 'next', 'react', 'svelte', 'vanilla', 'vue']) {
            const file = `examples/${name}/package.json`
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.dependencies['@neongate-ai/orbz-example-styles'] = 'workspace:*'
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          }
          NODE

          cat > src/react.types.ts <<'TS'
          import type { DetailedHTMLProps, HTMLAttributes } from 'react'
          import type {
            OrbzPresetName,
            OrbzReducedMotion,
            OrbzSize,
            OrbzState
          } from '@core/appearance.types'
          import type { OrbzElement } from '@element/element.types'

          export interface OrbzReactAttributes {
            'color-accent'?: string
            'color-background'?: string
            'color-highlight'?: string
            'color-primary'?: string
            'color-secondary'?: string
            elevated?: boolean | string
            paused?: boolean | string
            preset?: OrbzPresetName
            'reduced-motion'?: OrbzReducedMotion
            size?: OrbzSize
            speed?: number | string
            state?: OrbzState
          }

          export type OrbzReactIntrinsicProps = DetailedHTMLProps<
            HTMLAttributes<OrbzElement>,
            OrbzElement
          > & OrbzReactAttributes

          declare module 'react' {
            namespace JSX {
              interface IntrinsicElements {
                'orb-z': OrbzReactIntrinsicProps
              }
            }
          }

          export {}
          TS

          mkdir -p examples/styles
          cp examples/vanilla/src/styles.css examples/styles/styles.css
          cat > examples/styles/package.json <<'JSON'
          {
            "name": "@neongate-ai/orbz-example-styles",
            "version": "0.0.0",
            "private": true,
            "sideEffects": ["./styles.css"],
            "exports": {
              "./styles.css": "./styles.css"
            }
          }
          JSON

          python3 <<'PY'
          from pathlib import Path

          style_import_files = [
              Path('examples/vanilla/src/main.ts'),
              Path('examples/react/src/main.tsx'),
              Path('examples/vue/src/main.ts'),
              Path('examples/svelte/src/main.ts'),
              Path('examples/next/src/app/layout.tsx'),
          ]
          for file in style_import_files:
              text = file.read_text()
              text = text.replace('"./styles.css"', '"@neongate-ai/orbz-example-styles/styles.css"')
              text = text.replace("'./styles.css'", "'@neongate-ai/orbz-example-styles/styles.css'")
              file.write_text(text)

          angular = Path('examples/angular/angular.json')
          text = angular.read_text().replace(
              '"src/styles.css"',
              '"node_modules/@neongate-ai/orbz-example-styles/styles.css"'
          )
          angular.write_text(text)

          for file in Path('examples').glob('*/src/styles.css'):
              file.unlink()

          for path in [
              Path('examples/react/src/custom-elements.types.d.ts'),
              Path('examples/next/src/app/custom-elements.types.d.ts'),
          ]:
              if path.exists():
                  path.unlink()

          for path in [
              Path('examples/react/src/App.tsx'),
              Path('examples/next/src/app/orb-playground.tsx'),
          ]:
              text = path.read_text()
              if '@neongate-ai/orbz/react-types' not in text:
                  path.write_text('import "@neongate-ai/orbz/react-types";\n' + text)

          docs_register = Path('docs/app/register-element.client.tsx')
          text = docs_register.read_text()
          if '@neongate-ai/orbz/react-types' not in text:
              text = text.replace(
                  'import "@neongate-ai/orbz/browser";',
                  'import "@neongate-ai/orbz/react-types";\nimport "@neongate-ai/orbz/browser";'
              )
              docs_register.write_text(text)
          PY

      - name: Clean outputs and dependencies
        run: |
          find . -type d \( -name node_modules -o -name dist -o -name .next -o -name .angular -o -name .svelte-kit -o -name coverage -o -name .turbo \) -prune -exec rm -rf {} + || true
          rm -rf docs/public/_pagefind

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build Orbz
        run: |
          pnpm typecheck
          pnpm build
          test -f dist/react-types.js
          test -f dist/react-types.d.ts

      - name: Build Docs
        run: pnpm --filter @orbz/docs build

      - name: Build Vanilla
        run: pnpm --filter @orbz/example-vanilla build

      - name: Build React
        run: pnpm --filter @orbz/example-react build

      - name: Build Vue
        run: pnpm --filter @orbz/example-vue build

      - name: Build Svelte
        run: pnpm --filter @orbz/example-svelte build

      - name: Build Angular
        run: pnpm --filter @orbz/example-angular build

      - name: Build Next
        run: pnpm --filter @orbz/example-next build
